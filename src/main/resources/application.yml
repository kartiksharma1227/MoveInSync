spring:
  application:
    name: roster-sync
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roster}
    username: ${DB_USER:roster}
    password: ${DB_PASSWORD:roster}
    hikari:
      maximum-pool-size: 20
      # Give up after 10 s if every pooled connection is busy, instead of queueing forever.
      connection-timeout: 10000
      # Run once per connection, so every query is bounded: row-lock waits and statements can't hang forever.
      connection-init-sql: "SET lock_timeout = '${roster.db.lock-timeout}'; SET statement_timeout = '${roster.db.statement-timeout}'"
      data-source-properties:
        # The driver turns a JDBC batch into multi-row INSERTs: several times faster for nightly staging.
        reWriteBatchedInserts: true
  servlet:
    multipart:
      # A 200k-row file is ~25 MB. Uploads are spooled to a temp file on disk, not held in memory.
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    # Never keep a DB connection open while the HTTP response is being written.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

logging:
  pattern:
    # Every log line carries the request's correlation ID (empty for background jobs).
    correlation: "[cid=%X{correlationId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

roster:
  db:
    # Waiting longer than this for another transaction's row lock fails that record with LOCK_TIMEOUT (retryable).
    lock-timeout: 5s
    statement-timeout: 60s
  brake:
    # Share of active employees that may be missing from a nightly file before the run is held.
    threshold: 0.30
  recon:
    # A run with no progress for this long is treated as crashed: marked FAILED so the tenant can upload again.
    stuck-after-minutes: 60
    stuck-check-interval-ms: 300000
  ingest:
    max-batch-size: 1000
  outbox:
    # Turned off in tests (they run the relay by hand) and in the live crash demo (to hold the crash window open).
    relay-enabled: true
    poll-interval-ms: 500
    batch-size: 500
    # An event that fails this many times is parked (no longer retried) for an engineer to look at.
    max-attempts: 10
    retention-days: 7
  jwt:
    # Dev default only. Real deployments must set JWT_SECRET (at least 32 bytes for HS256).
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

---
# Local demo profile: also loads sample tenants, offices, employees and bookings.
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
