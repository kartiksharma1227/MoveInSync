# One-command run: `docker compose up --build` starts Postgres, waits until it is healthy, then starts the app.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roster
      POSTGRES_USER: roster
      POSTGRES_PASSWORD: roster
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster -d roster"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/roster
      DB_USER: roster
      DB_PASSWORD: roster
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"

volumes:
  db-data:
